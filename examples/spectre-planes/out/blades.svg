<text x="240.0" y="464" text-anchor="middle" fill="#1a4fb3" font-weight="bold">hollow, radius 4.93</text>
<text x="240.0" y="485" text-anchor="middle" fill="#222" font-weight="normal">filed 1.1 up from the shoulders (1.0 to 1.3)</text>
<text x="240.0" y="506" text-anchor="middle" fill="#222" font-weight="normal">6.2 wide at the mouth</text>
<text x="240.0" y="527" text-anchor="middle" fill="#222" font-weight="normal">cuts the bump stick's round face</text>
