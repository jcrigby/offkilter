<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 560" width="1320" height="560" font-family="Helvetica, Arial, sans-serif" font-size="15">
<rect width="100%" height="100%" fill="#fff"/>
<text x="30" y="34" font-size="21" font-weight="bold" fill="#222">The blades: 12 x 30 blanks of 0.81 mm scraper steel, edge down, filed square across</text>
<text x="30" y="58" fill="#555">scribe the curve from the master's end, file to the line, and try it on the master against the light; only the curve has to be right, the depth is set on the master</text>
