<text x="660.0" y="485" text-anchor="middle" fill="#222" font-weight="normal">1.1 proud of the shoulders (1.0 to 1.3)</text>
<text x="660.0" y="506" text-anchor="middle" fill="#222" font-weight="normal">6.7 wide at the root</text>
<text x="660.0" y="527" text-anchor="middle" fill="#222" font-weight="normal">cuts the dent stick's hollow face</text>
