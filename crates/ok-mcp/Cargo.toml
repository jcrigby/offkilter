[package]
name = "ok-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Model Context Protocol server that lets language models drive offkilter documents"

[[bin]]
name = "ok-mcp"
path = "src/main.rs"

[dependencies]
ok-model = { workspace = true }
ok-mesh = { workspace = true }
ok-step = { workspace = true }
ok-brep = { workspace = true }
ok-math = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "3", features = ["json"] }
